<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nyvei privacy zone</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
      body { display: flex; flex-direction: column; }
      #map { flex: 1; }
      #bar { padding: 10px 16px; border-top: 1px solid #e4e7eb; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
      #line { font-family: ui-monospace, Consolas, monospace; background: #f6f8fa; padding: 4px 8px; border-radius: 4px; }
      input { width: 64px; font: inherit; }
      button { font: inherit; border: 1px solid #d0d7de; background: #fff; border-radius: 4px; padding: 2px 10px; cursor: pointer; }
      .muted { color: #6a737d; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="bar">
      <span id="hint">Click your home on the map.</span>
      <label>Radius <input id="radius" type="number" min="50" max="2000" step="50" value="100" /> m</label>
      <span id="line" hidden></span>
      <button id="copy" type="button" hidden>Copy</button>
      <span id="inside" class="muted"></span>
    </div>
    <script type="module" src="/src/zone.ts"></script>
  </body>
</html>
