<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nyvei</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 13 Q8 1 14 13' fill='none' stroke='%23e8590c' stroke-width='3'/></svg>" />
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <header>
        <h1>nyvei</h1>
        <span id="status" class="muted">Loading…</span>
      </header>
      <section id="total"></section>
      <ul class="legend">
        <li><i style="--c: #e8590c"></i>Ridden road</li>
        <li><i style="--c: #6f7a87"></i>Unridden road</li>
        <li><i class="thin" style="--c: #8b3fd9"></i>Ridden track or path</li>
        <li><i class="thin dash" style="--c: #9aa2ab"></i>Unridden track or path</li>
      </ul>
      <details id="layers" open>
        <summary>Map</summary>
        <label class="field">Base map <select id="basemap"></select></label>
        <div id="heat-overlays" hidden>
          <label class="field" title="How strongly the Strava heat overlays below are drawn, from invisible to full. Only the look; it does not change routing.">Strava heat <input id="heat-opacity" type="range" min="0" max="1" step="0.05" /></label>
          <div id="heat-toggles" class="toggles"></div>
        </div>
        <label id="edge-heat-row" hidden title="Colours each unridden road and track by its bike heat: the busiest of Strava's road, gravel and MTB layers, averaged along that stretch. One number per road for cyclists of any kind, where the overlays are pixel pictures, and gravel and off-road there show only where those riders outnumber road riders."><input id="edge-heat" type="checkbox" /> Colour unridden roads by bike heat</label>
        <div id="edge-heat-legend" class="heat-legend" hidden><span class="muted">quiet</span><i class="heat-ramp"></i><span class="muted">busy</span></div>
      </details>
      <section id="ride-info" hidden>
        <div class="ride-head"><strong id="ride-name"></strong><button id="ride-clear" type="button">Clear</button></div>
        <div id="ride-new"></div>
        <ul class="legend">
          <li><i style="--c: #0ca678"></i>New, counted for this ride</li>
          <li><i class="faint" style="--c: #0ca678"></i>First ridden alongside</li>
          <li><i style="--c: #e8590c"></i>Ridden before</li>
        </ul>
      </section>
      <details id="route" open>
        <summary>Route</summary>
        <div class="route-row">
          <button id="route-pick" type="button">Pick start on map</button>
          <button id="route-centre" type="button">Start at map centre</button>
        </div>
        <div id="route-start" class="muted">No start yet</div>
        <div class="route-row">
          <label>Distance <input id="route-km" type="number" min="5" max="300" step="5" value="40" /> km</label>
          <label title="Keep the loop off tracks, paths and other bonus ways"><input id="route-roads" type="checkbox" /> Roads only</label>
          <label id="route-dead-row" hidden title="Leave out every road, track and path in the heat area that no cyclist on Strava rides: no road heat in road mode, no road or gravel (off-road) heat in gravel (off-road) mode. Residential streets always stay in, so every street gets ridden in the end. The heatmap knows where riding is good; about one in eight unridden roads around here has no heat and is not residential."><input id="route-dead" type="checkbox" checked /> Skip where no one rides</label>
          <label id="route-heat-row" hidden title="How strongly the loop is pulled towards busier roads, by the heat chosen on the right. It always prefers more heat; the percentage is only how much: at 70 % the busiest road costs 30 % of one nobody rides, a road with heat 60 costs 58 %. At 20 % the same are 80 % and 88 %, so a busy road still beats a quiet one, by less. From 75 % up a busy road you have ridden can win over an unridden one nobody rides.">Prefer bike heat <input id="route-heat" type="range" min="0" max="0.9" step="0.1" value="0.7" /> <span id="route-heat-val" class="muted"></span> on <select id="route-heat-mode" title="Which heat pulls the loop. Road: Strava's road ride heatmap. Gravel: gravel − road (the gold overlay) or half the road heat, whichever is higher on each road. Off-road: the same with gravel + mtb − road (the cyan overlay). Popular roads count in every mode, so the busier ones get ticked off first, but a busy gravel track beats a busy asphalt road."><option value="road">road</option><option value="gravel">gravel</option><option value="offroad">off-road</option></select></label>
          <button id="route-go" type="button" title="A loop out to the best patch of unridden roads in reach and back another way">Generate</button>
          <button id="route-sweep" type="button" title="Ride every unridden road you can reach, nearest first, dead ends included, and head home when the distance is used up. Good for a short easy spin around home.">Sweep</button>
          <button id="route-next" type="button">Try another</button>
        </div>
        <div id="route-result"></div>
        <div class="route-row"><span id="route-status" class="muted">Building route graph…</span><button id="route-gpx" type="button">Download GPX</button></div>
      </details>
      <details open>
        <summary>Kommuner</summary>
        <table id="kommuner">
          <thead><tr><th>Kommune</th><th class="num">Ridden</th><th class="num">km</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
      <details open>
        <summary>Rides</summary>
        <table id="rides">
          <thead><tr><th>Date</th><th>Name</th><th class="num">km</th><th class="num" title="New countable km">New</th><th class="num" title="New bonus km">Bonus</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
      <footer id="generated" class="muted"></footer>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
