# Rebuilds the site data from Intervals.icu and OpenStreetMap and publishes it
# to Cloudflare Pages: nightly, on every push to main, and on demand.
#
# Secrets: INTERVALS_API_KEY, INTERVALS_ATHLETE_ID, PRIVACY_ZONE (lat,lon,radius_m),
# CLOUDFLARE_API_TOKEN (Pages edit), CLOUDFLARE_ACCOUNT_ID.
# Variable: SITE_URL (the published address, for the link in each activity).
# Caches: ride GPX files and the writeback state accumulate across runs; road
# data is kept and refreshed from Overpass on the first of each month.

name: Publish

on:
  schedule:
    - cron: "30 1 * * *" # 02:30 or 03:30 Europe/Oslo
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore ride cache
        uses: actions/cache@v4
        with:
          path: cache/activities
          key: activities-${{ github.run_id }}
          restore-keys: activities-
      - name: Restore road cache
        uses: actions/cache@v4
        with:
          path: cache/roads
          key: roads-${{ github.run_id }}
          restore-keys: roads-

      - name: Fetch new rides
        run: pnpm rides
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      - name: Fetch roads (refreshed on the 1st of the month)
        run: pnpm roads $([ "$(date -u +%d)" = "01" ] && echo --refresh)
      - name: Match rides to roads
        run: pnpm match
        env:
          PRIVACY_ZONE: ${{ secrets.PRIVACY_ZONE }}
      - name: Write new km into the Intervals.icu activities
        run: pnpm writeback
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        run: pnpm pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
